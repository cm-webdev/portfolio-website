{% extends "projects.html" %}

{% block content %}
<h2>Morse Code Converter</h2>

<form method="POST" class="mb-3">
    <input type="text" name="text_input" class="form-control" placeholder="Enter text" value="{{ text }}">
    <button type="submit" class="btn btn-primary mt-2">Convert</button>
</form>

{% if result %}
<div class="mt-3">
    <h3>Output:</h3>
    <p>{{ result }}</p>
</div>
{% endif %}
{% endblock %}
