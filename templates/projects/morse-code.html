{% extends "index.html" %}

{% block content %}
<h1>Morse Code Converter</h1>

<form method="POST">
    <input type="text" name="text_input" placeholder="Enter text" value="{{ text }}">
    <button type="submit">Convert</button>
</form>

{% if result %}
<h2>Output:</h2>
<p>{{ result }}</p>
{% endif %}
{% endblock %}
